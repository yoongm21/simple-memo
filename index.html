<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>간단 메모장</title>
<style>*{box-sizing:border-box}body{margin:24px auto;padding:0 16px;max-width:560px;font-family:system-ui;background:white;color:#222}section,article{border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0}input,textarea,button{font:inherit;font-size:16px;padding:10px;max-width:100%}input,textarea{width:100%;margin:6px 0;border:1px solid #aaa;border-radius:4px}button{cursor:pointer;margin:4px 4px 4px 0}textarea{min-height:120px}p{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}#status{min-height:24px;color:#555}</style>
<h1>간단 메모장</h1><section id="auth"><form id="loginForm"><label>이메일<input id="email" type="email" required autocomplete="username"></label><label>비밀번호<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><button type="submit">로그인</button><button id="signup" type="button">회원가입</button></form></section>
<section id="app" hidden><div id="who"></div><button id="logout">로그아웃</button><form id="memoForm"><label>메모 내용<textarea id="content" required></textarea></label><button type="submit">저장</button></form><div id="list"></div></section><div id="status" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
const db=supabase.createClient('https://smheptswjvomevdjsmlq.supabase.co','sb_publishable_CzfBoalIOaH5RnvdGIz5og_BMDo-YV8');
const el=id=>document.getElementById(id);let user=null;
async function run(task,message){el('status').textContent=message;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await task();el('status').textContent='';}catch(e){el('status').textContent='오류: '+e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
async function list(){const {data,error}=await db.from('memos').select('*').order('created_at',{ascending:false});if(error)throw error;el('list').replaceChildren();if(!data.length){el('list').textContent='저장된 메모가 없습니다.';return;}data.forEach(m=>{const card=document.createElement('article'),p=document.createElement('p'),b=document.createElement('button');p.textContent=m.content;b.textContent='삭제';b.onclick=()=>run(async()=>{const {error}=await db.from('memos').delete().eq('id',m.id);if(error)throw error;await list();},'삭제 중…');card.append(p,b);el('list').append(card);});}
async function render(){const {data,error}=await db.auth.getSession();if(error)throw error;user=data.session?.user||null;el('auth').hidden=!!user;el('app').hidden=!user;el('password').value='';el('list').replaceChildren();if(user){el('who').textContent=user.email;await list();}}
el('loginForm').onsubmit=e=>{e.preventDefault();run(async()=>{const {error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});if(error)throw error;await render();},'로그인 중…');};
el('signup').onclick=()=>{if(!el('loginForm').reportValidity())return;run(async()=>{const {data,error}=await db.auth.signUp({email:el('email').value.trim(),password:el('password').value});if(error)throw error;if(!data.session)throw Error('이메일 확인 설정을 확인해 주세요.');await render();},'가입 중…');};
el('logout').onclick=()=>run(async()=>{const {error}=await db.auth.signOut();if(error)throw error;await render();},'로그아웃 중…');
el('memoForm').onsubmit=e=>{e.preventDefault();run(async()=>{const content=el('content').value.trim();if(!content)throw Error('메모를 입력해 주세요.');const {error}=await db.from('memos').insert({user_id:user.id,content});if(error)throw error;el('content').value='';await list();},'저장 중…');};
run(render,'불러오는 중…');
</script></html>
